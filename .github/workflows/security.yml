name: Public repository security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree-and-secrets:
    name: Public tree and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public-tree policy
        run: node scripts/check-public-tree.mjs

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --silent --show-error --location "$url" --output "/tmp/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/$archive" | sha256sum --check --strict
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          chmod 700 /tmp/gitleaks

      - name: Scan complete Git history
        run: /tmp/gitleaks git --no-banner --redact=100 .
